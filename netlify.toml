# DigiKitPro - Netlify config
# Two ways to deploy:
#  A) Drag-and-drop the folder at app.netlify.com/drop (no build, works instantly)
#  B) Connect the GitHub repository: the command below rebuilds the site and
#     automatically rewrites every link (robots.txt, sitemap, canonical, og:url)
#     to your real Netlify address, because Netlify always provides $URL.
#     With this, NO custom domain is needed and no link ever points to the
#     wrong host.
[build]
  publish = "."
  command = "SITE_URL=$URL python3 tools/build.py"

# Baseline browser protections. CSP starts conservatively because checkout,
# analytics and opt-in translation are third-party integrations.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://formsubmit.co https://payhip.com; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline' https://translate.googleapis.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://translate.google.com https://translate.googleapis.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://formsubmit.co; frame-src https://translate.google.com https://payhip.com; upgrade-insecure-requests"

# Long-cache immutable media, always-fresh HTML.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Note: deliberately NO SPA catch-all rewrite. This is a true multi-page site:
# every URL maps to a real file, and unknown URLs get the smart 404.html
# (which handles GitHub Pages-style directory redirects). Works the same on
# Netlify, Cloudflare Pages and GitHub Pages.

# ── SEO: redirect alternate URLs to canonical (prevents "Alternate page with proper canonical tag" duplicates) ──
# http → https and www → apex are handled by GitHub Pages' Enforce HTTPS; these Netlify rules cover the Netlify deploy
# and serve as documentation of the canonical behavior. GitHub Pages needs the same setting toggled in
# Settings → Pages → Enforce HTTPS (API currently reports https_enforced:false — enable it).
[[redirects]]
  from = "http://digikitpro.shop/*"
  to = "https://digikitpro.shop/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.digikitpro.shop/*"
  to = "https://digikitpro.shop/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.digikitpro.shop/*"
  to = "https://digikitpro.shop/:splat"
  status = 301
  force = true

# Clean /index.html suffix → directory canonical (e.g. /blog/slug/index.html → /blog/slug/)
[[redirects]]
  from = "/*/index.html"
  to = "/:splat/"
  status = 301
  force = true

