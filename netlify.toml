# DigiKitPro - Netlify config
# Two ways to deploy:
#  A) Drag-and-drop the folder at app.netlify.com/drop (no build, works instantly)
#  B) Connect the GitHub repository: the command below rebuilds the site and
#     automatically rewrites every link (robots.txt, sitemap, canonical, og:url)
#     to your real Netlify address, because Netlify always provides $URL.
#     With this, NO custom domain is needed and no link ever points to the
#     wrong host.
[build]
  publish = "."
  command = "SITE_URL=$URL python3 tools/build.py"

# Long-cache immutable media, always-fresh HTML.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Note: deliberately NO SPA catch-all rewrite. This is a true multi-page site:
# every URL maps to a real file, and unknown URLs get the smart 404.html
# (which handles GitHub Pages-style directory redirects). Works the same on
# Netlify, Cloudflare Pages and GitHub Pages.
