# ─────────────────────────────────────────────────────────────────────────────
# DigiKitPro — automatic build & deploy to GitHub Pages (100% free)
#
# HOW IT WORKS
#   1. Push this folder to a GitHub repository (see GO-LIVE.md for click-by-click).
#   2. In the repo: Settings → Pages → "Build and deployment" → Source = "GitHub Actions".
#   3. From then on, EVERY edit triggers this workflow:
#        python3 tools/build.py  →  rebuilds all HTML/sitemap  →  deploys live.
#      You can edit data/products.json or add a file in content/blog/ directly
#      on github.com (pencil icon → Commit) — no tools on your PC needed.
# ─────────────────────────────────────────────────────────────────────────────
name: Build & deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:            # "Run workflow" button for a manual rebuild

permissions:
  contents: write          # IndexNow state manifest (data/indexnow-state.json) is committed after a successful ping
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site (products.json + content/blog/*.md → HTML, sitemap, index)
        env:
          # Live custom domain (see the CNAME file at the repo root, which keeps
          # GitHub Pages from clearing the domain on every deploy). Every
          # absolute URL the build emits — canonicals, sitemaps, robots.txt,
          # schema.org, OG tags — is derived from this value.
          SITE_URL: https://digikitpro.shop
          # Optional: paste verification tokens here once Search Console issues them
          GOOGLE_VERIFY: ${{ vars.GOOGLE_VERIFY }}
          BING_VERIFY: ${{ vars.BING_VERIFY }}
          # Writes <key>.txt at the site root so IndexNow can verify the ping.
          # Harmless when unset: tools/build.py skips the key file.
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python3 tools/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .               # the repository root IS the built site

      - id: deployment
        uses: actions/deploy-pages@v4

      # AFTER the site is live, so crawlers are never sent to content that is
      # not yet deployed. Gated on INDEXNOW_KEY: with the variable unset the
      # step is skipped and the ping stays dormant. continue-on-error so a
      # ping failure can never fail a deploy. Does not call the retired
      # Google/Bing sitemap-ping endpoints (both have been dead for years).
      - name: Ping IndexNow for URLs whose HTML actually changed
        if: ${{ vars.INDEXNOW_KEY != '' }}
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          SITE_URL: https://digikitpro.shop
        run: python3 tools/submit_index.py

      - name: Commit IndexNow state manifest
        if: ${{ vars.INDEXNOW_KEY != '' }}
        continue-on-error: true
        run: |
          git config user.name "digikitpro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/indexnow-state.json
          if git diff --cached --quiet; then
            echo "IndexNow state unchanged."
            exit 0
          fi
          git commit -m "chore: update IndexNow state manifest"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
