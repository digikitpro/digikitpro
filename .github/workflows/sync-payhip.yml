name: Auto-sync new Payhip products

# Runs daily and on demand. If you add a product in Payhip, this workflow
# fetches it, adds it to data/products.json, generates its keywords and
# descriptions with tools/seo_engine.py, rebuilds the static site, and commits
# the change. The Build & deploy workflow then publishes it.
#
# Nothing here fails the site if Payhip is unreachable: payhip_sync.py exits 0
# when the store cannot be reached, and the commit step is skipped when the
# rebuild produces no diff.
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC every day
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: payhip-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new Payhip products
        run: python3 tools/payhip_sync.py

      - name: Generate SEO keywords and descriptions
        # payhip_sync.py already enriches the products it adds. This fills any
        # remaining gaps across the catalogue, so a product added by hand or
        # before this engine existed still gets keywords, tags, title, meta
        # description, blurb and alt text. Safe to run every time: existing
        # hand-written copy is never overwritten.
        run: python3 tools/seo_engine.py --all

      - name: Rebuild static site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          GOOGLE_VERIFY: ${{ vars.GOOGLE_VERIFY }}
          BING_VERIFY: ${{ vars.BING_VERIFY }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python3 tools/build.py

      - name: Commit auto-sync results
        run: |
          git config user.name "digikitpro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes."; exit 0
          fi
          git commit -m "Auto-sync: update Payhip catalog" -m "Generated by tools/payhip_sync.py + tools/seo_engine.py + tools/build.py"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Ping search engines (IndexNow) for the changed URLs
        if: ${{ vars.INDEXNOW_KEY != '' }}
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 tools/submit_index.py
