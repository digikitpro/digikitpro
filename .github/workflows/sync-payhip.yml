name: Auto-sync new Payhip products

# Runs daily and on demand. If you add a product in Payhip, this workflow
# fetches it, adds it to data/products.json, generates its keywords and
# descriptions with tools/seo_engine.py, rebuilds the static site, and commits
# the change. The Build & deploy workflow then publishes it. Since this workflow
# pushes with GITHUB_TOKEN (which suppresses follow-on push-triggered workflows),
# it explicitly dispatches the Pages deploy after a changed catalog is committed
# or an IndexNow notification needs a post-deployment retry.
#
# Nothing here fails the site if Payhip is unreachable: payhip_sync.py exits 0
# when the store cannot be reached, and the commit step is skipped when the
# rebuild produces no diff.
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC every day
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  actions: write
  contents: write

concurrency:
  group: payhip-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new Payhip products
        run: python3 tools/payhip_sync.py

      - name: Generate SEO keywords and descriptions
        # payhip_sync.py already enriches the products it adds. This fills any
        # remaining gaps across the catalogue, so a product added by hand or
        # before this engine existed still gets keywords, tags, title, meta
        # description, blurb and alt text. Safe to run every time: existing
        # hand-written copy is never overwritten.
        run: python3 tools/seo_engine.py --all

      - name: Rebuild static site
        env:
          SITE_URL: https://digikitpro.shop
          # Optional kill switch for both GA loading and first-party event counts.
          # Set repository variable DKP_ANALYTICS to false to disable in builds.
          DKP_ANALYTICS: ${{ vars.DKP_ANALYTICS || 'true' }}
          GOOGLE_VERIFY: ${{ vars.GOOGLE_VERIFY }}
          BING_VERIFY: ${{ vars.BING_VERIFY }}
          # Pinterest: empty values fall back to the defaults in tools/core.py.
          PINTEREST_URL: ${{ vars.PINTEREST_URL }}
          PINTEREST_VERIFY: ${{ vars.PINTEREST_VERIFY }}
          PINTEREST_TAG_ID: ${{ vars.PINTEREST_TAG_ID }}
          # Keep the daily rebuild identical to the deploy build: with this
          # unset here but set over there, a sync commit would silently flip
          # /partner/ back to invite-only until the next real deploy.
          PARTNER_SIGNUP_URL: ${{ vars.PARTNER_SIGNUP_URL }}
          # Same default as deploy.yml (the key is public by design); the
          # repository variable, if set, overrides it in both workflows.
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY || '2a0c816c785f97257c6a69f2d5cc3c47' }}
        run: python3 tools/build.py

      - name: Check generated search markup and sitemaps
        env:
          SITE_URL: https://digikitpro.shop
        run: python3 tools/qa_seo.py

      - name: Check IndexNow selection and retries offline
        env:
          SITE_URL: https://digikitpro.shop
        run: python3 tools/qa_indexnow.py

      - name: Commit auto-sync results
        id: commit
        run: |
          git config user.name "digikitpro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-sync: update Payhip catalog" -m "Generated by tools/payhip_sync.py + tools/seo_engine.py + tools/build.py"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Retry a failed or unrecorded IndexNow submission even on a no-change
      # sync, but only via a deployment so the URLs are live before the ping.
      - name: Check for pending IndexNow retry
        if: steps.commit.outputs.changed == 'false'
        id: indexnow
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY || '2a0c816c785f97257c6a69f2d5cc3c47' }}
          SITE_URL: https://digikitpro.shop
        run: |
          pending="$(python3 tools/submit_index.py --check-pending)"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Queue Pages deployment
        if: steps.commit.outputs.changed == 'true' || steps.indexnow.outputs.pending == 'true'
        uses: actions/github-script@v7
        env:
          TARGET_REF: ${{ github.ref_name }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy.yml",
              ref: process.env.TARGET_REF,
            });
            core.info("Queued Pages deployment for changes or a pending IndexNow retry.");

      # IndexNow is handled by the queued deploy workflow after Pages is live.
      # Pinging here would race the deployment and duplicate its notification.
