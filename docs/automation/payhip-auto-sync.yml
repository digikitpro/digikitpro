name: Auto-sync new Payhip products

# Runs daily and on demand. If you add a product in Payhip, this workflow
# fetches it, adds it to data/products.json with safe defaults, rebuilds the
# static site, and commits the change. The existing Build & deploy workflow
# then publishes it. Nothing here fails the site if Payhip is unreachable.
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC every day
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: payhip-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new Payhip products
        run: python3 tools/payhip_sync.py

      - name: Rebuild static site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          GOOGLE_VERIFY: ${{ vars.GOOGLE_VERIFY }}
          BING_VERIFY: ${{ vars.BING_VERIFY }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python3 tools/build.py

      - name: Commit auto-sync results
        run: |
          git config user.name "digikitpro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes."; exit 0
          fi
          git commit -m "Auto-sync: update Payhip catalog" -m "Generated by tools/payhip_sync.py + tools/build.py"
          git push

      - name: Ping search engines (IndexNow) for the changed URLs
        if: ${{ vars.INDEXNOW_KEY != '' }}
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 tools/submit_index.py
